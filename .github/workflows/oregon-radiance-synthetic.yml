name: Oregon Synthetic Radiance (isolated)
on:
  push:
    branches: [feature/oregon-av-digital-twin-v01]
    paths:
      - 'scientific-core/oregon-av/src/chipu_oregon/radiance_synthetic.py'
      - 'scientific-core/oregon-av/src/chipu_oregon/synthetic_epw.py'
      - '.github/workflows/oregon-radiance-synthetic.yml'
  workflow_dispatch:
    inputs:
      epw_path:
        description: 'Repository-relative EPW path, or synthetic for deterministic smoke test'
        required: true
        default: 'synthetic'
jobs:
  synthetic-radiance:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scientific-core/oregon-av
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Initialize evidence directory
        run: mkdir -p results/radiance-synthetic
      - name: Install Radiance and Python scientific packages
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee results/radiance-synthetic/radiance-download.log
          import json, os, pathlib, urllib.request, zipfile
          api = "https://api.github.com/repos/LBNL-ETA/Radiance/releases?per_page=10"
          req = urllib.request.Request(api, headers={"User-Agent": "oregon-av-ci", "Accept": "application/vnd.github+json"})
          releases = json.load(urllib.request.urlopen(req, timeout=45))
          choices = [(r, a) for r in releases for a in r.get("assets", [])
                     if a["name"].endswith("_Linux.zip")]
          if not choices:
              raise RuntimeError("No Linux zip found in the 10 latest official LBNL-ETA/Radiance releases")
          release, asset = choices[0]
          dest = pathlib.Path("results/radiance-synthetic/radiance-release.zip")
          print("Radiance release:", release["tag_name"], "asset:", asset["name"], "url:", asset["browser_download_url"], flush=True)
          urllib.request.urlretrieve(asset["browser_download_url"], dest)
          import hashlib
          print("Radiance archive SHA256:", hashlib.sha256(dest.read_bytes()).hexdigest(), flush=True)
          root = pathlib.Path("results/radiance-synthetic/radiance-install")
          root.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(dest) as z:
              for entry in z.infolist():
                  p = pathlib.PurePosixPath(entry.filename)
                  if p.is_absolute() or ".." in p.parts:
                      raise RuntimeError("Unsafe zip entry: " + entry.filename)
              z.extractall(root)
          bins = list(root.rglob("oconv"))
          if not bins:
              raise RuntimeError("Downloaded Radiance archive does not contain oconv")
          for binary in bins[0].parent.iterdir():
              if binary.is_file():
                  binary.chmod(binary.stat().st_mode | 0o111)
          bindir = bins[0].parent
          print("Radiance binary directory:", bindir.resolve(), flush=True)
          os.environ["GITHUB_PATH"] and pathlib.Path(os.environ["GITHUB_PATH"]).open("a").write(str(bindir.resolve()) + "\n")
          libs = list(root.rglob("ray/lib"))
          if libs:
              with pathlib.Path(os.environ["GITHUB_ENV"]).open("a") as f:
                  f.write("RAYPATH=.:" + str(libs[0].resolve()) + "\n")
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a") as f:
              f.write("RADIANCE_RELEASE=" + release["tag_name"] + "\n")
          PY
          export PATH="$(find results/radiance-synthetic/radiance-install -type f -name oconv -printf '%h' -quit):$PATH"
          python -m pip install -e . 2>&1 | tee results/radiance-synthetic/pip-project.log
          python -m pip install 'bifacial_radiance>=0.4,<1' 2>&1 | tee results/radiance-synthetic/pip-radiance.log
          command -v oconv
          command -v rtrace
          command -v gencumulativesky || true
      - name: Record environment and source
        run: |
          mkdir -p results/radiance-synthetic
          git rev-parse HEAD | tee results/radiance-synthetic/source-commit.txt
          python --version 2>&1 | tee results/radiance-synthetic/python-version.txt
          python -m pip freeze | sort | tee results/radiance-synthetic/dependencies.txt
          (oconv -version || true) 2>&1 | tee results/radiance-synthetic/oconv-version.txt
          (rtrace -version || true) 2>&1 | tee results/radiance-synthetic/rtrace-version.txt
      - name: Verify EPW input exists
        env:
          EPW_PATH: ${{ inputs.epw_path || 'synthetic' }}
        run: |
          if [ "$EPW_PATH" = "synthetic" ]; then
            python -m chipu_oregon.synthetic_epw --output results/radiance-synthetic/synthetic-smoke.epw
            EPW_PATH="scientific-core/oregon-av/results/radiance-synthetic/synthetic-smoke.epw"
          fi
          echo "RESOLVED_EPW=$GITHUB_WORKSPACE/$EPW_PATH" >> "$GITHUB_ENV"
          test -f "$GITHUB_WORKSPACE/$EPW_PATH" || {
            echo "Missing EPW at repository-relative path: $EPW_PATH" >&2
            echo "Provide a licensed EPW file on this feature branch, then rerun." >&2
            exit 2
          }
          sha256sum "$GITHUB_WORKSPACE/$EPW_PATH" | tee results/radiance-synthetic/input-epw.sha256
      - name: Run ray tracing and archive complete log
        env:
          EPW_PATH: ${{ inputs.epw_path || 'synthetic' }}
        run: |
          set -o pipefail
          python -m chipu_oregon.radiance_synthetic \
            --epw "$RESOLVED_EPW" \
            --output results/radiance-synthetic 2>&1 | tee results/radiance-synthetic/execution.log
      - name: Hash outputs
        if: always()
        run: |
          find results/radiance-synthetic -type f ! -name output-sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > results/radiance-synthetic/output-sha256.txt
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oregon-synthetic-radiance-evidence
          path: scientific-core/oregon-av/results/radiance-synthetic/
          if-no-files-found: warn
