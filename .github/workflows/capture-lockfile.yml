name: Capture Verified Lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lockfile:
    name: Generate verified npm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Generate dependency lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Pin direct dependencies to verified resolved versions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const section of ['dependencies', 'devDependencies']) {
            for (const name of Object.keys(pkg[section] || {})) {
              const entry = lock.packages[`node_modules/${name}`];
              if (!entry?.version) throw new Error(`No resolved version for ${name}`);
              pkg[section][name] = entry.version;
            }
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --no-audit --no-fund

      - name: Verify locked install
        run: npm ci --no-audit --no-fund

      - name: Verify production build
        run: npm run build

      - name: Verify dependency declarations
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const section of ['dependencies', 'devDependencies']) {
            for (const [name, spec] of Object.entries(pkg[section] || {})) {
              if (spec === 'latest') throw new Error(`${name} is still declared as latest`);
              const resolved = lock.packages[`node_modules/${name}`]?.version;
              if (resolved !== spec) throw new Error(`${name}: package.json=${spec}, lockfile=${resolved}`);
            }
          }
          NODE

      - name: Commit verified dependency files to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Verified dependency baseline already committed."
          else
            git commit -m "chore: lock verified production dependencies"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload verified lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cropsmart-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
