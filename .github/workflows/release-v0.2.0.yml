name: Publish CropSmart v0.2.0 Release

on:
  push:
    branches: [main]
    paths:
      - docs/RELEASE_v0.2.0.md
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  release:
    name: Publish research demonstrator baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish v0.2.0 release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "Release v0.2.0 already exists; leaving it unchanged."
          else
            gh release create v0.2.0 \
              --target "$GITHUB_SHA" \
              --title "CropSmart Research Digital Twin v0.2.0 — Research Demonstrator Baseline" \
              --notes-file docs/RELEASE_v0.2.0.md
          fi
